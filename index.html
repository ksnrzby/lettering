<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor písmen</title>
<style>
:root{--bg:#eef1f5;--pn:#fff;--tx:#1f2933;--mut:#6b7785;--ac:#3d6fa8;--ac2:#e7eff9;--ln:#dfe5ec;--r:12px;--in:#f5f7fa;--sh:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.05);--warn:#a4540a}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--pn:#1b2129;--tx:#e8edf2;--mut:#93a0ae;--ac:#7fb0e6;--ac2:#243447;--ln:#2b3541;--in:#222a33;--sh:none;--warn:#f0b070}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;padding:0 20px;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:block;font-size:16px;letter-spacing:.1px}.brand small{display:block;color:var(--mut);font-size:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8fc1ee,#3d6fa8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
main{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 340px}
aside{overflow:auto;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
#pl{border-right:1px solid var(--ln)}#pr{border-left:1px solid var(--ln)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:0}
#cv{position:relative;min-height:0;touch-action:none;background:radial-gradient(ellipse at 50% 35%,var(--pn),var(--bg) 75%)}
#cv canvas{display:block;width:100%;height:100%}
#views{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:var(--pn);border:1px solid var(--ln);border-radius:999px;box-shadow:var(--sh)}
#views button{min-height:32px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:13px}#views button:hover{background:var(--ac2)}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12.5px;color:var(--mut);pointer-events:none}
label{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px;margin:6px 0;min-height:36px}
label>span{font-size:13px;color:var(--mut)}output{font-size:12px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;accent-color:var(--ac)}
input[type=text],select{grid-column:2/4;min-height:38px;font:inherit;padding:0 10px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:inherit;width:100%}
input[type=color]{grid-column:2/4;width:100%;height:38px;border:1px solid var(--ln);border-radius:10px;background:var(--in);padding:3px}
button{font:inherit;min-height:40px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:inherit;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{border-color:var(--ac)}button.on,.tile.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.wide{width:100%;margin-top:6px}button.danger{color:#b4372f}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;padding:0 18px;min-height:40px}button.primary:disabled{opacity:.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:var(--in);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px}
.seg button{border:0;background:none;min-height:36px}.seg button.on{background:var(--ac);color:#fff}
.note{margin:6px 0 2px;font-size:12.5px;color:var(--mut)}
.warn{font-size:12.5px;color:var(--warn);margin:4px 0 0}.warn:empty{display:none}
.pkrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:6px 0}.pkrow>span{font-size:13px;color:var(--mut)}
.fp{text-align:left;font-size:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:340px;overflow:auto;margin:6px 0;padding:6px;border:1px solid var(--ln);border-radius:var(--r);background:var(--in)}.fg[hidden]{display:none}
.gh{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 2px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:68px;padding:6px 8px;text-align:left;overflow:hidden;background:var(--pn)}
.tile span{font-size:26px;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile b{font-size:11px;font-weight:400;opacity:.7}
#list{display:flex;flex-wrap:wrap;gap:6px}#list button{min-height:34px;padding:0 12px;border-radius:999px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lt{position:relative}.lt>button:first-child{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;min-height:92px;background:var(--pn)}
.lt img{width:60px;height:60px;object-fit:contain}.lt b{font-size:11px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt .x{position:absolute;top:3px;right:3px;width:22px;height:22px;min-height:0;padding:0;border-radius:50%;line-height:1;font-size:14px;background:var(--in);color:var(--mut)}

.chk{display:flex;align-items:center;gap:8px;grid-template-columns:none;font-size:13px;color:var(--tx)}.chk input{width:18px;height:18px}
.pr{display:flex;align-items:center;gap:10px;margin:6px 0}.pr input[type=color]{width:56px;height:34px;flex:none}
#msg{font-size:12.5px;color:var(--mut);margin-top:8px;min-height:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:1060px){body{height:auto;min-height:100%}main{display:flex;flex-direction:column}
#cv{position:sticky;top:0;z-index:5;height:50vh;order:-1;border-bottom:1px solid var(--ln)}#pl,#pr{overflow:visible;border:0}header small{display:none}}
.tgrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:6px 0}.tgrow input[type=text]{min-width:0}
.slot{display:grid;grid-template-columns:1fr auto 40px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.slot small{display:block;color:var(--mut);font-size:12px}.slot b{font-size:13.5px;word-break:break-word}.slot button{min-height:34px}
</style>

const tree=(P,t=CL.ClipType.ctUnion,Q=[])=>{const c=new CL.Clipper();c.AddPaths(P,CL.PolyType.ptSubject,true);

  walk(T);return out}

function textPaths(font,text,h,fit){
  text=[...text].filter(ch=>ch==' '||font.charToGlyphIndex(ch)).join('');
  const P=[];let c,x=0,y=0;const add=(a,b)=>c.push([a,-b]);
  let cm;try{cm=font.getPath(text,0,0,100).commands}catch(e){cm=font.getPath(text,0,0,100,{features:[]}).commands}
  for(const k of cm){
    if(k.type=='M'){c=[];P.push(c);add(k.x,k.y)}
    else if(k.type=='L')add(k.x,k.y);
    else if(k.type=='Q')for(let i=1;i<=8;i++){const t=i/8,u=1-t;add(u*u*x+2*u*t*k.x1+t*t*k.x,u*u*y+2*u*t*k.y1+t*t*k.y)}
    else if(k.type=='C')for(let i=1;i<=10;i++){const t=i/10,u=1-t;add(u*u*u*x+3*u*u*t*k.x1+3*u*t*t*k.x2+t*t*t*k.x,u*u*u*y+3*u*u*t*k.y1+3*u*t*t*k.y2+t*t*t*k.y)}
    if(k.x!==undefined){x=k.x;y=k.y}
  }
  const f=P.flat();if(!f.length)return [];
  const xs=f.map(p=>p[0]),ys=f.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=fit?h/(y1-y0):h/100,cx=(x0+x1)/2,cy=(y0+y1)/2;
  return paths(tree(P.map(p=>p.map(([a,b])=>({X:Math.round((a-cx)*s*S),Y:Math.round((b-cy)*s*S)})))));
}

  const sh=it.shape;if(!sh||sh=='none'||!it.paths.length)return[];

  if(sh=='cloud'){const Hh=h+2*p,W=w+2*p+Hh*.5;let U=off([mm2P([[cx-W/2+Hh*.3,cy-Hh*.3],[cx+W/2-Hh*.3,cy-Hh*.3],[cx+W/2-Hh*.3,cy+Hh*.3],[cx-W/2+Hh*.3,cy+Hh*.3]])],Hh*.3);
    const n=Math.max(3,Math.round(W/(Hh*.95)));
    for(let i=0;i<n;i++){const t=n>1?i/(n-1):.5,x=cx-W/2+Hh*.42+(W-Hh*.84)*t,rr=Hh*(.34+.2*Math.sin(Math.PI*t));
      U=paths(tree(U,CL.ClipType.ctUnion,[mm2P(circ(x,cy+Hh*.12,rr,40))]))}

  const rc=(a,b,c,d)=>mm2P([[a,b],[c,b],[c,d],[a,d]]),U2=(A,B)=>paths(tree(A,CL.ClipType.ctUnion,B)),D2=(A,B)=>paths(tree(A,CL.ClipType.ctDifference,B));

    for(const sg of[-1,1])U=U2(U,[mm2P(circ(cx+sg*R*.72,cy+R*.72,R*.3,32))]);
    return U}
  if(sh=='scale'){const W=w+2*p+3,Hh=h+2*p+1;let U=off([rc(cx-W/2+2,cy-Hh/2+2,cx+W/2-2,cy+Hh/2-2)],2);
    const dr=Math.min(W*.2,Hh*.55);U=U2(U,[mm2P(circ(cx,cy+Hh/2+dr*.35,dr,40))]);
    return D2(U,[mm2P(circ(cx,cy+Hh/2+dr*.35,dr*.5,32))])}
  if(sh=='ruler'){const W=w+2*p+2,Hh=h+2*p+5,y0=cy-h/2-p-5;let U=off([rc(cx-W/2+1,y0+1,cx+W/2-1,y0+Hh-1)],1);

    for(let i=1;i<n;i++){const x=cx-W/2+i*(W/n),len=i%5==0?4.2:2.4;holes.push(rc(x-.5,y0-1,x+.5,y0+len))}
    return D2(U,holes)}
