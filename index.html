<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor písmen</title>
<style>
:root{--bg:#e9eef2;--pn:#fff;--tx:#25303a;--ac:#4f82b3;--ln:#d5dde4;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#161b20;--pn:#1f262d;--tx:#e6ecf1;--ln:#34404a;--ac:#8fb8e0}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.35 "Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:1fr 340px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#cv{position:relative;min-height:0;touch-action:none}#cv canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:10px;font-size:13px;opacity:.65;pointer-events:none}
aside{background:var(--pn);border-left:1px solid var(--ln);overflow:auto;padding:14px 16px 24px}
h2{font-size:16px;margin:18px 0 8px;font-weight:700}h2:first-child{margin-top:0}
label{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;margin:7px 0;min-height:36px}
label>span{font-size:14px}output{font-size:13px;text-align:right;opacity:.7}
input[type=range]{width:100%;height:32px}
.pkrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:7px 0}.pkrow>span{font-size:14px}
.fp{text-align:left;font-size:19px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:360px;overflow:auto;margin:6px 0;padding:2px;border:1px solid var(--ln);border-radius:var(--r)}.fg[hidden]{display:none}
.warn{font-size:13px;color:#a4540a;margin:4px 0;min-height:0}@media(prefers-color-scheme:dark){.warn{color:#f0b070}}
.gh{grid-column:1/-1;font-size:12px;opacity:.65;padding:6px 4px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:68px;padding:6px 8px;text-align:left;overflow:hidden}
.tile span{font-size:26px;line-height:1.15;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tile b{font-size:11px;font-weight:400;opacity:.65}input[type=checkbox]{width:28px;height:28px;justify-self:start}
input[type=text],select{grid-column:2/4;min-height:40px;font:inherit;padding:0 10px;border:1px solid var(--ln);border-radius:var(--r);background:var(--bg);color:inherit;width:100%}
input[type=color]{width:100%;height:40px;border:1px solid var(--ln);border-radius:var(--r);background:none;padding:2px;grid-column:2/4}
button{font:inherit;min-height:44px;padding:0 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--bg);color:inherit;cursor:pointer}
button.on,.tile.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.two{grid-template-columns:1fr 1fr}
#list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}#list button{min-height:36px;padding:0 10px}
#go{width:100%;margin-top:20px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#msg{font-size:13px;margin-top:8px;min-height:18px;opacity:.8}
@media(max-aspect-ratio:1/1){body{grid-template-columns:1fr;grid-template-rows:48vh 1fr}aside{border-left:0;border-top:1px solid var(--ln)}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>

/* ---------- 2D geometrie (Clipper, 1 mm = 1000 jednotek) ---------- */
const tree=(P,t=CL.ClipType.ctUnion,Q=[])=>{const c=new CL.Clipper();c.AddPaths(P,CL.PolyType.ptSubject,true);
  if(Q.length)c.AddPaths(Q,CL.PolyType.ptClip,true);const T=new CL.PolyTree();
  c.Execute(t,T,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return T};
const paths=T=>CL.Clipper.PolyTreeToPaths(T);
const off=(P,d)=>{const o=new CL.ClipperOffset(2,20),T=new CL.PolyTree();
  o.AddPaths(P,CL.JoinType.jtRound,CL.EndType.etClosedPolygon);o.Execute(T,d*S);return paths(T)};
const toV=c=>c.map(p=>new V2(p.X/S,p.Y/S));
function shapesOf(T){const out=[];const walk=n=>n.Childs().forEach(c=>{if(c.IsHole())return;
  const s=new THREE.Shape(toV(c.Contour()));c.Childs().forEach(h=>{s.holes.push(new THREE.Path(toV(h.Contour())));walk(h)});out.push(s)});
  walk(T);return out}
const geo=(P,d)=>{const sh=shapesOf(tree(P));return sh.length?new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false,curveSegments:1}):null};

function textPaths(font,text,h,fit){
  const P=[];let c,x=0,y=0;const add=(a,b)=>c.push([a,-b]);
  let cm;try{cm=font.getPath(text,0,0,100).commands}catch(e){cm=font.getPath(text,0,0,100,{features:[]}).commands}
  for(const k of cm){
    if(k.type=='M'){c=[];P.push(c);add(k.x,k.y)}
    else if(k.type=='L')add(k.x,k.y);
    else if(k.type=='Q')for(let i=1;i<=8;i++){const t=i/8,u=1-t;add(u*u*x+2*u*t*k.x1+t*t*k.x,u*u*y+2*u*t*k.y1+t*t*k.y)}
    else if(k.type=='C')for(let i=1;i<=10;i++){const t=i/10,u=1-t;add(u*u*u*x+3*u*u*t*k.x1+3*u*t*t*k.x2+t*t*t*k.x,u*u*u*y+3*u*u*t*k.y1+3*u*t*t*k.y2+t*t*t*k.y)}
    if(k.x!==undefined){x=k.x;y=k.y}
  }
  const f=P.flat();if(!f.length)return [];
  const xs=f.map(p=>p[0]),ys=f.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const s=fit?h/(y1-y0):h/100,cx=(x0+x1)/2,cy=(y0+y1)/2;
  return paths(tree(P.map(p=>p.map(([a,b])=>({X:Math.round((a-cx)*s*S),Y:Math.round((b-cy)*s*S)})))));
}

/* dekorace: obrysy v jednotkách výšky 1 */
const circ=(x,y,r,n=40)=>Array.from({length:n},(_,i)=>[x+r*Math.cos(i/n*6.2832),y+r*Math.sin(i/n*6.2832)]);
const ell=(x,y,a,b,n=40)=>Array.from({length:n},(_,i)=>[x+a*Math.cos(i/n*6.2832),y+b*Math.sin(i/n*6.2832)]);
const DEC={
 'Obláček':()=>[circ(-.22,-.02,.2),circ(.02,.1,.27),circ(.27,-.02,.21),ell(0,-.1,.45,.16)],
 'Hvězda':()=>[Array.from({length:10},(_,i)=>{const r=i%2?.22:.5,a=Math.PI/2+i*Math.PI/5;return[r*Math.cos(a),r*Math.sin(a)]})],
 'Srdce':()=>[Array.from({length:60},(_,i)=>{const t=i/60*6.2832;return[16*Math.sin(t)**3/34,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/34+.02]})],
 'Měsíc':()=>[circ(0,0,.5),circ(.24,.1,.42)],
 'Balón':()=>[circ(0,.17,.33),[[-.13,-.1],[.13,-.1],[.03,-.24],[-.03,-.24]],[[-.025,-.22],[.025,-.22],[.025,-.34],[-.025,-.34]],[[-.09,-.5],[.09,-.5],[.09,-.34],[-.09,-.34]]],
 'Medvídek':()=>[circ(0,.14,.2),circ(-.15,.31,.08),circ(.15,.31,.08),ell(0,-.14,.2,.23),ell(-.24,-.1,.07,.14),ell(.24,-.1,.07,.14),circ(-.12,-.36,.1),circ(.12,-.36,.1)]};
function decoPaths(type,size){
  const P=DEC[type]().map(p=>{const q=p.map(([x,y])=>({X:Math.round(x*size*S),Y:Math.round(y*size*S)}));if(!CL.Clipper.Orientation(q))q.reverse();return q});
  return type=='Měsíc'?paths(tree([P[0]],CL.ClipType.ctDifference,[P[1]])):paths(tree(P));
}

const ev=new Evaluator();ev.attributes=['position','normal'];
const sub=(a,b)=>{if(!a||!b)return a;const A=new Brush(a),B=new Brush(b);A.updateMatrixWorld();B.updateMatrixWorld();return ev.evaluate(A,B,SUBTRACTION).geometry};

const v={ch:'T',lf:'Titan One',lh:160,shell:1,wall:2.4,front:3,D:20,lc:'#a8cfee',nm:'Theodor',nf:'Pacifico',back:3,fc:'#ffffff',ori:1,pt:'',pw:6,pg:6,ph:1,pc:'#a8cfee',pm:0,warn:[],mnt:0,bk:3,key:null};

let letterPaths=[];
function patPaths(){
  const pl=off(letterPaths,-v.wall-.15);let x0=1e12,x1=-1e12,y0=1e12,y1=-1e12;
  pl.forEach(c=>c.forEach(p=>{x0=Math.min(x0,p.X);x1=Math.max(x1,p.X);y0=Math.min(y0,p.Y);y1=Math.max(y1,p.Y)}));
  const w=v.pw*S,P=w+v.pg*S,cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+P,out=[];
  if('hvd'.includes(v.pt)){const a={h:0,v:Math.PI/2,d:Math.PI/4}[v.pt],ca=Math.cos(a),sa=Math.sin(a);
    for(let t=-R;t<R;t+=P)out.push([[-R,t],[R,t],[R,t+w],[-R,t+w]].map(([u,k])=>({X:Math.round(cx+u*ca-k*sa),Y:Math.round(cy+u*sa+k*ca)})))}
  else if(v.pt=='k'){for(let i=0;x0+i*w<x1;i++)for(let j=0;y0+j*w<y1;j++)if((i+j)%2==0){const X=x0+i*w,Y=y0+j*w;out.push([{X,Y},{X:X+w,Y},{X:X+w,Y:Y+w},{X,Y:Y+w}])}}
  else{const fn={o:()=>[circ(0,0,.5)],s:DEC['Hvězda'],r:DEC['Srdce']}[v.pt];let j=0;
    for(let y=y0;y<y1+P;y+=P,j++)for(let x=x0+(j%2?P/2:0);x<x1+P;x+=P)fn().forEach(pg=>{const q=pg.map(([a,b])=>({X:Math.round(x+a*w),Y:Math.round(y+b*w)}));if(!CL.Clipper.Orientation(q))q.reverse();out.push(q)})}
  return paths(tree(out,CL.ClipType.ctIntersection,pl));
}
function buildPattern(){pat.visible=false;if(!v.shell||!v.pt||!plate.visible)return;
  const g=geo(patPaths(),v.ph);if(g){pat.geometry.dispose();pat.geometry=g;pat.position.z=v.D;pat.visible=true}}
const KH={hd:10,nd:6,ht:3,sl:14,clr:.3},GAP=2; // GAP = odstup písmene od zdi/opěrky, aby kořen trnu mohl mít náběh
const mP=p=>{const q=p.map(([a,b])=>({X:Math.round(a*S),Y:Math.round(b*S)}));if(!CL.Clipper.Orientation(q))q.reverse();return q};
function centroid(P){let A=0,X=0,Y=0;for(const c of P)for(let i=0;i<c.length;i++){const a=c[i],b=c[(i+1)%c.length],k=a.X*b.Y-b.X*a.Y;A+=k;X+=(a.X+b.X)*k;Y+=(a.Y+b.Y)*k}return[X/(3*A)/S,Y/(3*A)/S]}
function khPaths(x,y,w=(KH.nd+2*KH.clr)/2,r=(KH.hd+2*KH.clr)/2){return paths(tree([circ(x,y,r,32),[[x-w,y],[x+w,y],[x+w,y+KH.sl],[x-w,y+KH.sl]]].map(mP)))}
function solveKey(L){
  const cv=off(L,-(v.wall+1.5)),r=KH.hd/2+KH.clr+1.5,[cx]=centroid(L);let ymax=-1e9,ymin=1e9;
  cv.forEach(c=>c.forEach(p=>{ymax=Math.max(ymax,p.Y/S);ymin=Math.min(ymin,p.Y/S)}));
  for(let y=ymax-KH.sl;y>ymin;y-=3){let b=null;
    for(let x=-120;x<=120;x+=3)if((b===null||Math.abs(x-cx)<Math.abs(b-cx))&&paths(tree(khPaths(x,y,r,r),CL.ClipType.ctDifference,cv)).length==0)b=x;
    if(b!==null)return{x:b,y,cx}}
  return null}
const mgAll=a=>mergeGeometries(a.map(q=>{q=q.index?q.toNonIndexed():q.clone();q.deleteAttribute('uv');return q}));
const cyl=(r0,r1,h,z)=>{const g=new THREE.CylinderGeometry(r1,r0,h,40);g.rotateX(Math.PI/2);g.translate(0,0,z+h/2);return g};
const postGeo=(x,y,z0)=>{const nl=GAP+v.bk+.3,rn=KH.nd/2,rh=KH.hd/2;
  return [cyl(rn+2.5,rn,GAP,z0),cyl(rn,rn,nl,z0),cyl(rn,rh,rh-rn,z0+nl),cyl(rh,rh,KH.ht-(rh-rn),z0+nl+rh-rn)].map(g=>g.translate(x,y,0))};
const bx=(w,h,d,x,y,z)=>{const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g};
function mountParts(){
  const k=v.key,L=letterPaths;let x0=1e9,x1=-1e9,y0=1e9;L.forEach(c=>c.forEach(p=>{x0=Math.min(x0,p.X/S);x1=Math.max(x1,p.X/S);y0=Math.min(y0,p.Y/S)}));
  const plate=new THREE.Shape([new V2(-30,-20),new V2(30,-20),new V2(30,20),new V2(-30,20)]);
  [-22,22].forEach(x=>{const h=new THREE.Path();h.absarc(x,0,2.25,0,6.2832);plate.holes.push(h)});
  const wall=mgAll([new THREE.ExtrudeGeometry(plate,{depth:4,bevelEnabled:false,curveSegments:16}),...postGeo(0,0,3.9)]);
  const rt=6,bt=6,bz=30,fz=v.D+25+GAP,Wb=Math.min(200,Math.max(80,(x1-x0)*.9+20)),py=k.y+KH.sl-y0,Hr=py+KH.hd/2+8,xm=(x0+x1)/2;
  const gs=[-1,1].map(sg=>{const t=new THREE.Shape([new V2(-rt,0),new V2(-rt-bz,0),new V2(-rt,Hr*.6)]);
    const g=new THREE.ExtrudeGeometry(t,{depth:6,bevelEnabled:false});g.rotateY(-Math.PI/2);g.translate(sg*(Wb/2-15)+3,0,0);return g});
  const st=mgAll([bx(Wb,bt,fz+rt+bz,0,-bt/2,(fz-rt-bz)/2),bx(Wb,Hr,rt,0,Hr/2,-rt/2),...gs,...postGeo(k.x-xm,py,0)]);
  st.rotateX(Math.PI/2);st.computeBoundingBox();st.translate(0,0,-st.boundingBox.min.z);
  return{wall,stand:st,Wb,Hr}}
function showWarn(){const e=document.getElementById('warn');if(e)e.textContent=v.warn.join(' ')}
function buildLetter(){
  letterPaths=textPaths(fcache[v.lf],v.ch||'T',v.lh,true);v.warn=[];v.key=null;
  const parts=tree(letterPaths).Childs().length,AR=P=>Math.abs(P.reduce((s,c)=>s+CL.Clipper.Area(c),0));
  if(parts>1)v.warn.push(`Znak se skládá z ${parts} oddělených dílů, nedrží pohromadě (např. háček nebo tečka).`);
  if(letterPaths.length&&AR(off(off(letterPaths,-1.5),1.5))<.92*AR(letterPaths))v.warn.push('Tenké tahy pod 3 mm, písmeno bude křehké.');
  let g=geo(letterPaths,v.D)||new THREE.BufferGeometry();plate.visible=false;
  if(v.shell&&g.attributes.position){ // záda zavřená, otevřeno zepředu; čelo je samostatný díl uložený na římse
    const L=letterPaths,bk=Math.max(v.mnt?3:.8,Math.min(v.back,v.D-v.front-2));v.bk=bk;
    const cav=geo(off(L,-(v.wall+1.5)),v.D-v.front-bk+.04),rec=geo(off(L,-v.wall),v.front+.04),pg=geo(off(L,-v.wall-.15),v.front);
    if(cav){cav.translate(0,0,bk-.02);g=sub(g,cav)}else v.warn.push('Dutina se do tohoto písmene nevejde. Zmenši stěnu, nebo zvětši výšku.');
    if(rec){rec.translate(0,0,v.D-v.front);g=sub(g,rec)}
    if(pg){plate.geometry.dispose();plate.geometry=pg;plate.visible=true}
    if(v.mnt){
      if(v.D-v.front-bk<KH.ht+1.5)v.warn.push('Dutina je příliš mělká pro držák (hlavička 3 mm). Zvětši hloubku nebo uber záda či čelo.');
      else{const k=solveKey(L);
        if(!k)v.warn.push('Pro držák se v písmeni nenašlo dost široké místo (potřeba tah aspoň asi 18 mm).');
        else{v.key=k;if(Math.abs(k.x-k.cx)>6)v.warn.push('Těžiště je mimo osu zavěšení, písmeno se bude naklánět.');
          const kg=geo(khPaths(k.x,k.y),bk+.04);if(kg){kg.translate(0,0,-.02);g=sub(g,kg)}}}
    }
  }
  letter.geometry.dispose();letter.geometry=g;placeZ();buildPattern();showWarn();
}
const placeZ=()=>{plate.position.z=v.D-v.front;items.forEach(it=>it.mesh.position.z=v.D-it.P)};
function buildItem(it){
  it.P=Math.min(it.P,maxP());
  it.paths=it.kind=='Jméno'?textPaths(fcache[v.nf],v.nm,it.size,false):decoPaths(it.kind,it.size);
  it.mesh.geometry.dispose();it.mesh.geometry=geo(it.paths,it.T+it.P)||new THREE.BufferGeometry();
  it.mesh.rotation.z=it.rot*Math.PI/180;it.mesh.position.z=v.D-it.P;
}
function addItem(kind,x=0,y=0){
  const nm=kind=='Jméno',it={id:++uid,kind,size:nm?30:45,rot:0,T:nm?4:5,P:1.5,clr:.2,color:'#ffffff',mesh:new THREE.Mesh(new THREE.BufferGeometry(),mat('#ffffff'))};
  it.mesh.position.set(x,y,0);scene.add(it.mesh);items.push(it);buildItem(it);select(it);
}
function select(it){sel=it;items.forEach(i=>i.mesh.material.emissive.set(i===it?0x223344:0x000000));panel()}

/* ---------- přetahování ---------- */
const ray=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,0,1),0),pt=new THREE.Vector3(),off0=new THREE.Vector3();let drag=false;
const ndc=e=>{const r=cv.getBoundingClientRect();return new V2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1)};
renderer.domElement.addEventListener('pointerdown',e=>{
  ray.setFromCamera(ndc(e),cam);const h=ray.intersectObjects(items.map(i=>i.mesh))[0];if(!h)return;
  select(items.find(i=>i.mesh===h.object));pl.constant=-(v.D+2);ray.ray.intersectPlane(pl,pt);
  off0.copy(pt).sub(sel.mesh.position);drag=true;ctl.enabled=false;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;ray.setFromCamera(ndc(e),cam);
  if(ray.ray.intersectPlane(pl,pt)){sel.mesh.position.x=pt.x-off0.x;sel.mesh.position.y=pt.y-off0.y}});
const end=()=>{drag=false;ctl.enabled=true};
renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);

/* ---------- panel ---------- */
const pn=document.getElementById('pn');
const R=(id,l,mn,mx,val,st=1)=>`<label><span>${l}</span><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${val}"><output>${val}</output></label>`;
const opts=(o,cur)=>Object.keys(o).map(k=>`<option ${k==cur?'selected':''}>${k}</option>`).join('');
const pk=k=>`<div class="pkrow"><span>Font</span><button type="button" class="fp" data-pk="${k}" style="font-family:'${v[k]}',sans-serif">${v[k]}</button></div><div class="fg" id="fg_${k}" hidden></div>`;
function openPicker(k){const g=document.getElementById('fg_'+k);if(!g.hidden){g.hidden=true;return}
  if(!g.innerHTML){const smp=(k=='lf'?v.ch:v.nm)||'Aa',tile=([n,,,w,lw,lt])=>`<button type="button" class="tile${n==v[k]?' on':''}" data-p="${k}" data-n="${n}"><span style="font-family:'${n}',sans-serif">${smp}</span><b>${n}${k=='lf'?(lt?' · '+lt:''):w?w==1?' · tenké místy':' · příliš tenké':''}</b></button>`;
    g.innerHTML=[['p','Psací (spojité)'],['t','Tučné a ostatní']].map(([t,h])=>`<div class="gh">${h}</div>`+FL.filter(x=>x[2]==t).sort((a,b)=>k=='lf'?a[4]-b[4]:a[3]-b[3]).map(tile).join('')).join('');
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){loadFace(e.target.dataset.n);io.unobserve(e.target)}}),{root:g,rootMargin:'200px'});
    g.querySelectorAll('.tile').forEach(t=>io.observe(t))}
  g.hidden=false}
async function pickFont(k,n){await getFont(n);v[k]=n;if(k=='lf')buildLetter();else items.filter(i=>i.kind=='Jméno').forEach(buildItem);panel()}
function panel(){
  const it=sel;
  pn.innerHTML=`<h2>Písmeno</h2>
  <label><span>Znak</span><input type="text" id="ch" maxlength="1" value="${v.ch}"></label>
  ${pk('lf')}
  ${R('lh','Výška (mm)',80,200,v.lh)}${R('D','Hloubka (mm)',10,40,v.D)}
  <div class="row two"><button data-m="0" class="${v.shell?'':'on'}">Plné</button><button data-m="1" class="${v.shell?'on':''}">Skořepina</button></div>
  ${v.shell?R('wall','Stěna (mm)',1.2,6,v.wall,.2)+R('back','Záda (mm)',1.2,6,v.back,.2)+R('front','Čelo (mm)',1.6,6,v.front,.2)+`<label><span>Barva čela</span><input type="color" id="fc" value="${v.fc}"></label>`:''}
  <label><span>Barva</span><input type="color" id="lc" value="${v.lc}"></label>
  <div id="warn" class="warn"></div>
  <h2>Jméno</h2>
  <label><span>Text</span><input type="text" id="nm" value="${v.nm}"></label>
  ${pk('nf')}
  <button id="addn" style="width:100%">${items.some(i=>i.kind=='Jméno')?'Jméno je v návrhu':'Přidat jméno'}</button>
  <h2>Dekorace</h2>
  <div class="row">${Object.keys(DEC).map(k=>`<button data-d="${k}">${k}</button>`).join('')}</div>
  <div id="list">${items.map(i=>`<button data-s="${i.id}" class="${i===sel?'on':''}">${i.kind}</button>`).join('')}</div>
  ${it?`<h2>Vybráno: ${it.kind}</h2>
  <label><span>Barva</span><input type="color" id="ic" value="${it.color}"></label>
  ${R('is','Velikost (mm)',10,150,it.size)}${R('ir','Otočení (°)',-180,180,it.rot)}${R('it','Tloušťka (mm)',2,12,it.T,.5)}${R('ip','Zapuštění (mm)',0.5,maxP(),it.P,.1)}${R('iv','Vůle (mm)',0,.5,it.clr,.05)}
  <button id="del" style="width:100%">Smazat díl</button>`:''}
  ${v.shell?`<h2>Vzor čela</h2>
  <label><span>Vzor</span><select id="pt">${[['','Žádný'],['h','Vodorovné pruhy'],['v','Svislé pruhy'],['d','Šikmé pruhy'],['k','Šachovnice'],['o','Puntíky'],['s','Hvězdičky'],['r','Srdíčka']].map(([k,n])=>`<option value="${k}" ${k==v.pt?'selected':''}>${n}</option>`).join('')}</select></label>
  ${v.pt?R('pw','Šířka/velikost (mm)',1,20,v.pw,.5)+(v.pt=='k'?'':R('pg','Mezera (mm)',1,30,v.pg,.5))+R('ph','Výška (mm)',.4,3,v.ph,.2)+`<label><span>Barva vzoru</span><input type="color" id="pc" value="${v.pc}"></label><label><span>Export</span><select id="pm"><option value="0" ${v.pm?'':'selected'}>Vzor jako samostatný díl</option><option value="1" ${v.pm?'selected':''}>Čelo + vzor v jednom (výměna filamentu)</option></select></label>`:''}`:''}
  ${v.shell?`<h2>Držák (zavěšení / stojánek)</h2><label><span>Držák</span><select id="mnt"><option value="0" ${v.mnt?'':'selected'}>Bez držáku</option><option value="1" ${v.mnt?'selected':''}>Klíčová dírka na zádech</option></select></label>`:''}
  <label><span>Písmeno v STL</span><select id="ori"><option value="1" ${v.ori?'selected':''}>Všechny díly čelem dolů (k tisku)</option><option value="0" ${v.ori?'':'selected'}>Jako v náhledu (čelem nahoru)</option></select></label>
  <button id="go">Stáhnout STL (ZIP)</button><div id="msg"></div>`;
  loadFace(v.lf);loadFace(v.nf);showWarn();
}
let tm;const later=f=>{clearTimeout(tm);tm=setTimeout(f,150)};
const H={
 ch:e=>{v.ch=e.value.toUpperCase();later(buildLetter)},lf:e=>{v.lf=e.value;buildLetter()},
 lh:e=>{v.lh=+e.value;later(buildLetter)},D:e=>{v.D=+e.value;later(buildLetter)},
 wall:e=>{v.wall=+e.value;later(buildLetter)},front:e=>{v.front=+e.value;items.forEach(buildItem);later(buildLetter)},back:e=>{v.back=+e.value;later(buildLetter)},fc:e=>plate.material.color.set(v.fc=e.value),ori:e=>v.ori=+e.value,pt:e=>{v.pt=e.value;buildPattern();panel()},pw:e=>{v.pw=+e.value;later(buildPattern)},pg:e=>{v.pg=+e.value;later(buildPattern)},ph:e=>{v.ph=+e.value;later(buildPattern)},pc:e=>pat.material.color.set(v.pc=e.value),pm:e=>v.pm=+e.value,mnt:e=>{v.mnt=+e.value;buildLetter()},
 lc:e=>letter.material.color.set(v.lc=e.value),
 nm:e=>{v.nm=e.value;items.filter(i=>i.kind=='Jméno').forEach(i=>later(()=>buildItem(i)))},
 nf:e=>{v.nf=e.value;items.filter(i=>i.kind=='Jméno').forEach(buildItem)},
 ic:e=>sel.mesh.material.color.set(sel.color=e.value),
 is:e=>{sel.size=+e.value;later(()=>buildItem(sel))},ir:e=>{sel.rot=+e.value;sel.mesh.rotation.z=sel.rot*Math.PI/180},
 it:e=>{sel.T=+e.value;later(()=>buildItem(sel))},
 ip:e=>{sel.P=+e.value;later(()=>buildItem(sel))},iv:e=>sel.clr=+e.value};
pn.addEventListener('input',e=>{const o=e.target.nextElementSibling;if(o&&o.tagName=='OUTPUT')o.textContent=e.target.value;H[e.target.id]?.(e.target)});
pn.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pk){openPicker(b.dataset.pk);return}
  if(b.dataset.p){pickFont(b.dataset.p,b.dataset.n);return}
  if(b.dataset.m!==undefined){v.shell=+b.dataset.m;items.forEach(buildItem);buildLetter();panel()}
  else if(b.dataset.d)addItem(b.dataset.d,(Math.random()-.5)*40,(Math.random()-.5)*40);
  else if(b.dataset.s)select(items.find(i=>i.id==b.dataset.s));
  else if(b.id=='addn'&&!items.some(i=>i.kind=='Jméno'))addItem('Jméno');
  else if(b.id=='del'){scene.remove(sel.mesh);items.splice(items.indexOf(sel),1);select(items[0]||null)}
  else if(b.id=='go')exportZip(b)});

/* ---------- export ---------- */
const hex=c=>c.replace('#','');
async function exportZip(btn){
  const msg=document.getElementById('msg');btn.disabled=true;msg.textContent='Počítám díly…';await new Promise(r=>setTimeout(r,50));
  try{
    const ex=new STLExporter(),z=new JSZip(),L=[];
    const add=(n,g,info)=>{const dv=ex.parse(new THREE.Mesh(g),{binary:true});z.file(n,new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength));L.push(n+' – '+info)};
    let g=letter.geometry,pg=plate.visible?plate.geometry.clone().translate(0,0,v.D-v.front):null,pp=pat.visible?pat.geometry.clone().translate(0,0,v.D):null;
    for(const it of items){const p=geo(off(it.paths,it.clr),it.P+.02);if(!p)continue;
      p.rotateZ(it.mesh.rotation.z);p.translate(it.mesh.position.x,it.mesh.position.y,v.D-it.P);g=sub(g,p);if(pg)pg=sub(pg,p);if(pp){const p2=geo(off(it.paths,it.clr),it.P+v.ph+.04);p2.rotateZ(it.mesh.rotation.z);p2.translate(it.mesh.position.x,it.mesh.position.y,v.D-it.P);pp=sub(pp,p2)}}
    const flip=q=>v.ori?q.clone().rotateY(Math.PI).translate(0,0,v.D):q.clone(); // 1 = čelem dolů (T zůstává ve slicru vzpřímené), 0 = jako v náhledu
    add(`${v.ch}_pismeno_${hex(v.lc)}.stl`,flip(g),`písmeno ${v.ch}, ${v.shell?'skořepina':'plné'}, výška ${v.lh} mm, hloubka ${v.D} mm, tisk čelem dolů`);
    const fh=q=>v.ori?q.clone().rotateY(Math.PI).translate(0,0,v.D+v.ph):q.clone();
    const mg=(a,b)=>mergeGeometries([a,b].map(q=>{q=q.clone();if(q.index)q=q.toNonIndexed();q.deleteAttribute('uv');return q}));
    if(pg&&pp&&v.pm)add(`${v.ch}_celo+vzor_${hex(v.fc)}.stl`,fh(mg(pg,pp)),`čelo s vzorem v jednom dílu, tisk čelem dolů; výměna filamentu ve výšce ${v.ph} mm: spodních ${v.ph} mm barva vzoru ${v.pc}, výš barva čela ${v.fc}`);
    else{
      if(pg)add(`${v.ch}_celo_${hex(v.fc)}.stl`,flip(pg),`čelní deska, tloušťka ${v.front} mm, vkládá se do otevřeného čela písmene, tisk čelem dolů`);
      if(pp)add(`${v.ch}_vzor_${hex(v.pc)}.stl`,fh(pp),`vzor na čele, výška ${v.ph} mm, lepí se na čelní desku`);
    }
    if(v.key){const m=mountParts();
      add('drzak_zed.stl',m.wall,'destička na zeď: 2 otvory Ø4,5 mm, tiskni hlavičkou nahoru; pro těžší písmena raději použij šroub s hlavou do 9 mm');
      add('drzak_stojan.stl',m.stand,`stojan: deska ${m.Wb.toFixed(0)} mm široká, opěrka ${m.Hr.toFixed(0)} mm vysoká; tiskni jak je (deska naplocho), 4+ stěny, PETG/ASA`)}
    const cnt={};
    items.forEach(it=>{const k=it.kind=='Jméno'?'jmeno':it.kind;cnt[k]=(cnt[k]||0)+1;
      add(`${k}${it.kind=='Jméno'?'':'_'+cnt[k]}_${hex(it.color)}.stl`,(h=>{const q=geo(it.paths,h);return v.ori?q.rotateY(Math.PI).translate(0,0,h):q})(it.T+it.P),
        `${it.kind}, velikost ${it.size} mm, výška dílu ${(it.T+it.P).toFixed(1)} mm, spodních ${it.P} mm zapadá do kapsy`)});
    z.file('seznam_dilu.txt',L.join('\n'));
    const a=document.createElement('a');a.href=URL.createObjectURL(await z.generateAsync({type:'blob'}));
    a.download=`navrh_${v.ch}.zip`;a.click();msg.textContent=`Hotovo: ${L.length} souborů.`;
  }catch(err){console.error(err);msg.textContent='Export se nepovedl: '+err.message}
  btn.disabled=false;
}

await Promise.all([getFont(v.lf),getFont(v.nf)]);buildLetter();addItem('Jméno');
</script></body></html>
